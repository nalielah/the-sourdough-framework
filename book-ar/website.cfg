% website.cfg — Arabic fork of the upstream website build config
%
% Original: The Sourdough Framework by Hendrik Kleinwächter,
% the-sourdough-framework.com, CC BY-SA 4.0. The Arabic edition inherits
% CC BY-SA 4.0.
%
% Fork of book/website.cfg (upstream verbatim otherwise). Re-derived
% 2026-11-16 for the R3 website reconversion after the 2026-11-13 workspace
% loss, from the Phase 23 record (phase23-step2-qa-report.md §2 item 2) and
% the accepted Phase 23 build (phase23-website-build.zip, book-ar.css lines
% 292-294 carry the exact CSS additions). Approved Arabic additions:
%   - RTL CSS: html/body direction rtl, text-align right.
%   - Three @font-face rules for the bundled woff2 fonts (fonts/ dir,
%     copied into the build output by hand, md5s of record:
%     Amiri-Regular 6900bd2b4b4470ae614dbc692af98257,
%     Amiri-Bold 4fecd88b6b813e7ef017432cff75813d,
%     NotoNaskhArabic-Bold 933cfe5f5ce2241fabfdcc8e9ac51af0).
%   - h1-h6 heading rule mapping to Noto Naskh Arabic Bold.
% Approved removal: the Open Sans external-CDN \Configure{@HEAD} block
% (fonts fully bundled; system fallback for Latin; no font CDN).
% The upstream TikZ 1.5 mm pad, titlepage/crosslinks/tableofcontents
% configuration and the [chapter,section,subsection] TOC filter list are
% upstream-verbatim. المصادر stays ABSENT from the website TOC per the
% Phase 24 I5-4 ruling (upstream-faithful; do not add it).
% The PDF build never reads this file.

\Preamble{xhtml,2,sec-filename,fn-in,fonts,svg,mathml,mathjax,nostyle}
\DeclareGraphicsExtensions{.png,.svg,.jpg,.jpeg,.JPG,.eps,.pdf,.mps}
% fix rendering of degree celsius
\DeclareSIUnit\degreeCelsius{\text{°C}}
\Configure{Gin-dim}{}
\Css{img {
    max-width: 100\%;
    height: auto;
}}
% Arabic edition: RTL layout and bundled fonts (Phase 23 approved additions).
\Css{html, body { direction: rtl; text-align: right; }}
\Css{ @font-face { font-family: 'Amiri'; font-weight: 400; font-style: normal; src: url('fonts/Amiri-Regular.woff2') format('woff2'); } @font-face { font-family: 'Amiri'; font-weight: 700; font-style: normal; src: url('fonts/Amiri-Bold.woff2') format('woff2'); } @font-face { font-family: 'Noto Naskh Arabic'; font-weight: 700; font-style: normal; src: url('fonts/NotoNaskhArabic-Bold.woff2') format('woff2'); } }
\Css{h1, h2, h3, h4, h5, h6 { font-family: 'Noto Naskh Arabic', 'Amiri', sans-serif; }}

\Configure{AddCss}{style.css}
\AddToHook{env/tikzpicture/begin}{\fontfamily{opensans-TLF}\selectfont}
% dvisvgm crops every TikZ picture to its bounding box, and TikZ leaves the
% line width out of that box. The 2 mm outline of the decision diamonds stuck
% out and lost its tips (Flowchart 3.1, "Ready?"), and 13 of the book's 23
% drawings lost a stroke somewhere. A little room around every picture keeps
% the strokes whole. The printed book does not read this file.
\tikzset{every picture/.append style={execute at end picture={%
  \path (current bounding box.south west) +(-1.5mm,-1.5mm)
        (current bounding box.north east) +(1.5mm,1.5mm);}}}
\ConfigureEnv{titlepage}{\ifvmode\IgnorePar\fi\EndP\HCode{<main class="titlepage">}}{\ifvmode\IgnorePar\fi\EndP\HCode{</main>}}{}{}

% Mini TOC
\Configure{crosslinks+}{%
  \bgroup
  % container for the page toc
  \Configure{tableofcontents}{\IgnorePar\EndP\HCode{<nav class="TOC">}\IgnorePar}
  {\HCode{\Hnewline}}{\IgnorePar\HCode{</nav>\Hnewline}\ShowPar}{}{}%
  \TableOfContents[chapter,section,subsection]% Print table of contents before crosslinks
  \egroup
  \ifvmode\IgnorePar\fi\EndP%
  \HCode{<main class="main-content">\Hnewline<nav class="crosslinks-top">} }
  {\HCode{</nav>\Hnewline}}
{\ifvmode\IgnorePar\fi\EndP%
  \HCode{<nav class="crosslinks-bottom">}}{\HCode{</nav>}}{}{}

% configuration for TOC on the main page
\Configure{tableofcontents}{\IgnorePar\EndP\HCode{<nav class="TOC">}\IgnorePar}
{}{\IgnorePar\HCode{</nav>\Hnewline<main class="main-content">\Hnewline}\ShowPar}{}{}%

% close the <main> element started in \Configure{crosslinks+}
\Configure{@/BODY}{\ifvmode\IgnorePar\fi\EndP\HCode{</main>}}
% Goatcounter counting

\renewcommand\listofflowcharts{%
\chapter*{\listoflocname}%
\TableOfContents[loc]%
}
\ConfigureToc{loc}{\HCode{<span class="lofToc">}}{\ }{}{\HCode{</span><br />}}

\begin{document}
\EndPreamble
